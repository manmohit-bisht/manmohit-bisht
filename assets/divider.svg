<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82FF"/>
      <stop offset="50%" stop-color="#8B7CF8"/>
      <stop offset="100%" stop-color="#FF3D8A"/>
    </linearGradient>
    <!-- white shimmer gradient -->
    <linearGradient id="shine" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="20" y="14" width="1160" height="4" rx="2"/>
    </clipPath>
  </defs>
  
  <!-- base full line - 2px tall rounded -->
  <rect x="20" y="15" width="1160" height="2.5" rx="1.25" fill="url(#base)"/>
  
  <!-- animated shimmer moving across -->
  <g clip-path="url(#clip)">
    <rect x="0" y="14" width="180" height="4" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="-200 0; 1220 0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
